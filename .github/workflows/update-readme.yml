name: Update README

on:
  # Once a day after the nightly collection, instead of on every report merge.
  # Report PRs land many times an hour, and per-merge runs raced each other
  # pushing bot/readme-refresh.
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: readme-refresh
  cancel-in-progress: false

jobs:
  refresh-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate live README sections
        run: python3 scripts/generate_readme.py

      - name: Regenerate daily index summaries
        run: python3 scripts/aggregate.py --all

      - name: Open PR with README and index updates
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: refresh live README stats and daily index"
          title: "docs: refresh live README stats and daily index"
          body: |
            Automated refresh from scripts/generate_readme.py and scripts/aggregate.py.
          branch: bot/readme-refresh
          delete-branch: true
          add-paths: |
            README.md
            data/_index/**

      # PRs opened with GITHUB_TOKEN start no pull_request workflows, so the
      # required scope-and-validate check would never report and the PR would
      # sit BLOCKED. Run the guard on the bot branch and let auto-merge land it.
      - name: Run Contributor Guard and enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          gh workflow run contributor-guard.yml --repo "$GITHUB_REPOSITORY" --ref bot/readme-refresh
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
